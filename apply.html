<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Katie WFH - Application Form</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>

    <header>

        <div class="logo">
            <img src="logo.png" alt="Katie WFH Logo">
        </div>

        <a href="index.html" class="back-home">
            Back Home
        </a>

    </header>


    <section class="application-section">

        <h1>Remote Work Application</h1>

        <p>
            Fill in your details below to apply for available remote opportunities.
        </p>




            <form action="https://formspree.io/f/mqeroqjp" method="POST" enctype="multipart/form-data">

<div class="form-group">

<h2>Personal Information</h2>

<label>First Name</label>
<input type="text" name="first_name" placeholder="Enter your first name">


            <label>Middle Name</label>
            <input type="text" name="middle_name" placeholder="Enter your middle name">


            <label>Last Name</label>
            <input type="text" name="last_name" placeholder="Enter your last name">
<label>Email Address</label>
<input type="email" name="email" placeholder="Enter your email address">


<label>Phone Number</label>
<input type="tel" name="phone" placeholder="Enter your phone number">

            <label>Date of Birth</label>
            <input
  type="text"
  id="dob"
  name="dob"
  placeholder="DD/MM/YYYY"
  maxlength="10"
  required
>
<label>Profile Picture (Recent Photo)</label>
<input type="file" accept="image/*" capture="user">

            <label>Select ID Type</label>

<select>
    <option value="">Choose your ID type</option>
    <option value="national-id">National ID</option>
    <option value="drivers-license">Driver's License</option>
    <option value="passport">International Passport</option>
    <option value="other">Other Government ID</option>
</select>

<label>Upload Your ID</label>
<input type="file" accept="image/*,.pdf">
            </div>


<div class="form-group">

<h2>Location Details</h2>
            <label>Country</label>
<input type="text" name="country" placeholder="Enter your country">


<label>State of Residence</label>
<input type="text" name="state" placeholder="Enter your state">


<label>Home Address</label>
<textarea name="home_address" placeholder="Enter your full address"></textarea>
</div>


<div class="form-group">

<h2>Work Information</h2>

<label>Current Status</label>

<select name="current_status">
    <option value="">Select your current status</option>
    <option value="employed">Employed</option>
    <option value="student">Student</option>
    <option value="unemployed">Unemployed</option>
    <option value="self-employed">Self-Employed</option>
    <option value="freelancer">Freelancer</option>
    <option value="other">Other</option>
</select>
<label>Do you have a reliable internet connection?</label>

<select name="internet_connection">
    <option value="">Select an option</option>
    <option value="yes">Yes</option>
    <option value="no">No</option>
</select>

<label>How did you hear about us?</label>

<select name="hear_about_us">
    <option value="">Select an option</option>
    <option value="facebook">Facebook</option>
    <option value="instagram">Instagram</option>
    <option value="tiktok">TikTok</option>
    <option value="whatsapp">WhatsApp</option>
    <option value="google">Google Search</option>
    <option value="friend">Friend or Family</option>
    <option value="other">Other</option>
</select>
<label>Can you pass a background check?</label>

<select name="background_check">
    <option value="">Select an option</option>
    <option value="yes">Yes</option>
    <option value="no">No</option>
</select>


<input type="text" name="emergency_contact" placeholder="Enter emergency contact name and phone number">

</div>
<label>Can you pass a background check?</label>

<select>
    <option value="">Select an option</option>
    <option value="yes">Yes</option>
    <option value="no">No</option>
</select>





<button type="submit">
    Submit Application
</button>

        </form>

    </section>
<script src="script.js"></script>
</body>

</body>

</html>
